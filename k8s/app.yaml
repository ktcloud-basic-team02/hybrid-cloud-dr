apiVersion: v1
kind: Namespace
metadata:
  name: beaver
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: beaver
data:
  DB_HOST: REPLACE_WITH_DB_PRIVATE_HOST
  DB_PORT: "3306"
  DB_NAME: shop
  SERVER_ENV: aws
  SERVICE_MODE: active
  ENABLE_RESET: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: beaver
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: shop
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: shop
    spec:
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: shop
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: shop
      containers:
        - name: shop
          image: REPLACE_WITH_ECR_IMAGE_AND_TAG
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: shop-config
            - secretRef:
                name: shop-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: beaver
spec:
  type: ClusterIP
  selector:
    app: shop
  ports:
    - name: http
      port: 80
      targetPort: http
