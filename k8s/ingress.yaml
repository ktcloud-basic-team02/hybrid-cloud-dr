# ALB(80) -> ingress-nginx NodePort(30887) -> 이 Ingress -> Service shop:80 -> Pod:5000
# host 없음: ALB 기본 주소로 바로 접속 가능. 도메인 확정 후 host 추가.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: beaver
spec:
  ingressClassName: nginx   # kubectl get ingressclass 결과와 동일해야 함
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80
