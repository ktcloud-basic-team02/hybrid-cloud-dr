# 도메인 연결 후 적용용 (ingress.yaml 대체)
# - beaver-shop.cloud 로 접속 가능
# - host 없는 규칙을 함께 둬서 ALB 기본 주소로도 계속 접속 가능
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: beaver
spec:
  ingressClassName: nginx   # kubectl get ingressclass 결과와 동일해야 함
  rules:
    - host: beaver-shop.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80
