# Template only: choose the installed NGINX controller's IngressClass first.
# This creates an app routing rule, not an ALB or an Ingress controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: beaver
spec:
  ingressClassName: REPLACE_WITH_INGRESS_CLASS
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80
