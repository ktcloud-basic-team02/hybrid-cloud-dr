name: image-scan

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/image-scan.yml"
  push:
    branches: [ main ]
    paths:
      - "app/**"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Dockerfile 린트 (Hadolint)
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: 이미지 빌드
        run: docker build --pull -t shop:${{ github.sha }} app/

      - name: 이미지 취약점 스캔 (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 고정
        with:
          image-ref: shop:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table