<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drop - 한정 수량 스니커</title>
<style>
:root { --bg:#e9ecf1; --ink:#121826; --sub:#5b6577; --panel:#fff; --line:#d3d9e3; --accent:#2347ff; --warn:#c2310f; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; line-height:1.5; }
button, input { font:inherit; }
button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
header { display:flex; justify-content:space-between; align-items:center; padding:16px 32px; background:var(--ink); color:#fff; }
.brand { font-size:26px; font-weight:800; letter-spacing:-1px; }
.right { display:flex; gap:14px; align-items:center; font-size:14px; }
.badge { padding:3px 12px; border-radius:99px; font-weight:700; font-size:13px; }
.badge.aws { background:#ff9900; color:#121826; } .badge.onprem { background:#3ea66b; color:#fff; }
.btn { padding:9px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
.btn.ghost { background:transparent; color:inherit; border:1px solid currentColor; }
.btn:disabled { background:#aab2c0; cursor:not-allowed; }
.layout { max-width:1120px; margin:28px auto; padding:0 20px; display:grid; grid-template-columns:1fr 320px; gap:24px; align-items:start; }
.feature { border-radius:14px; padding:36px; color:#fff; display:flex; justify-content:space-between; align-items:flex-end; gap:20px; min-height:240px; }
.feature h1 { margin:0 0 4px; font-size:40px; letter-spacing:-1.5px; line-height:1.1; }
.feature .left { font-size:84px; font-weight:800; line-height:1; text-align:right; }
.feature .left small { display:block; font-size:14px; font-weight:500; }
.feature .btn { background:#fff; color:var(--ink); margin-top:14px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; margin-top:20px; }
.item { background:var(--panel); border-radius:10px; overflow:hidden; border:1px solid var(--line); }
.swatch { height:110px; padding:12px; color:#fff; font-weight:700; font-size:20px; display:flex; align-items:flex-end; }
.item .body { padding:12px; display:flex; justify-content:space-between; align-items:center; }
.item .price { font-weight:700; } .item .stock { color:var(--sub); font-size:13px; }
.side { position:sticky; top:20px; display:grid; gap:16px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }
.panel h2 { margin:0 0 12px; font-size:16px; }
.line { display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:14px; }
.qty button { width:24px; height:24px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; }
.total { display:flex; justify-content:space-between; font-weight:700; border-top:1px solid var(--line); margin-top:8px; padding-top:10px; }
.muted { color:var(--sub); font-size:14px; }
#msg { min-height:22px; margin-top:8px; font-size:14px; color:var(--warn); } #msg.ok { color:#1f7a4d; }
dialog { border:0; border-radius:12px; padding:26px; width:340px; }
dialog::backdrop { background:rgba(18,24,38,.55); }
dialog input { width:100%; padding:10px; margin:6px 0; border:1px solid var(--line); border-radius:6px; }
dialog .row { display:flex; gap:8px; margin-top:10px; }
@media (max-width:860px) { .layout { grid-template-columns:1fr; } .side { position:static; } .feature { flex-direction:column; align-items:flex-start; } .feature .left { text-align:left; } header { padding:14px 18px; } }
</style>
</head>
<body>
<header>
  <div class="brand">drop</div>
  <div class="right">
    <span class="badge {{ env }}">{{ env_name }}</span>
    <span id="who"></span>
    <button class="btn ghost" id="authBtn">로그인</button>
  </div>
</header>

<div class="layout">
  <main>
    <section class="feature" id="feature"></section>
    <div class="grid" id="grid"></div>
  </main>
  <aside class="side">
    <section class="panel">
      <h2>장바구니</h2>
      <div id="cart"><p class="muted">로그인하면 장바구니를 쓸 수 있습니다.</p></div>
      <div id="msg" role="status"></div>
    </section>
    <section class="panel">
      <h2>최근 주문</h2>
      <div id="orders"><p class="muted">아직 주문이 없습니다.</p></div>
    </section>
  </aside>
</div>

<dialog id="dlg">
  <h2 style="margin-top:0">drop 계정</h2>
  <input id="u" placeholder="이름" autocomplete="username">
  <input id="p" type="password" placeholder="비밀번호 (4자 이상)" autocomplete="current-password">
  <div class="muted" id="dmsg" style="color:var(--warn);min-height:20px"></div>
  <div class="row">
    <button class="btn" id="doLogin">로그인</button>
    <button class="btn ghost" id="doSignup" style="color:var(--accent)">회원가입</button>
    <button class="btn ghost" id="doClose" style="color:var(--sub)">닫기</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const won = n => n.toLocaleString() + "원";
let products = [], user = null, cart = [];

async function api(url, method, body) {
  const r = await fetch(url, { method: method || "GET", headers: {"Content-Type":"application/json"},
                               body: body ? JSON.stringify(body) : undefined });
  return { ok: r.ok, status: r.status, data: await r.json() };
}

function say(text, ok) { $("msg").textContent = text || ""; $("msg").className = ok ? "ok" : ""; }

function renderProducts() {
  const feat = products.find(p => p.limited), rest = products.filter(p => !p.limited);
  if (feat) {
    $("feature").style.background = feat.color;
    $("feature").innerHTML = `<div><div>이번 주 한정 판매</div><h1>${feat.name}</h1><div>${won(feat.price)}</div>
      <button class="btn" onclick="add(${feat.id})" ${feat.stock < 1 ? "disabled" : ""}>${feat.stock < 1 ? "품절" : "장바구니 담기"}</button></div>
      <div class="left">${feat.stock}<small>남은 수량</small></div>`;
  }
  $("grid").innerHTML = rest.map(p => `<div class="item"><div class="swatch" style="background:${p.color}">${p.name}</div>
    <div class="body"><div><div class="price">${won(p.price)}</div><div class="stock">재고 ${p.stock}</div></div>
    <button class="btn" onclick="add(${p.id})" ${p.stock < 1 ? "disabled" : ""}>담기</button></div></div>`).join("");
}

function renderCart() {
  if (!user) { $("cart").innerHTML = '<p class="muted">로그인하면 장바구니를 쓸 수 있습니다.</p>'; return; }
  if (!cart.length) { $("cart").innerHTML = '<p class="muted">장바구니가 비어 있습니다.</p>'; return; }
  let sum = 0;
  const rows = cart.map(c => {
    const p = products.find(x => x.id === c.id); if (!p) return "";
    sum += p.price * c.qty;
    return `<div class="line"><span>${p.name}</span><span class="qty"><button onclick="add(${c.id},-1)">-</button> ${c.qty} <button onclick="add(${c.id},1)">+</button></span></div>`;
  }).join("");
  $("cart").innerHTML = rows + `<div class="total"><span>합계</span><span>${won(sum)}</span></div>
    <button class="btn" style="width:100%;margin-top:12px" onclick="order()">주문하기</button>`;
}

function renderAuth() {
  $("who").textContent = user ? user + " 님" : "";
  $("authBtn").textContent = user ? "로그아웃" : "로그인";
  renderCart();
}

async function add(id, delta) {
  if (!user) { $("dlg").showModal(); return; }
  const r = await api("/api/cart", "POST", { product_id: id, delta: delta || 1 });
  if (r.ok) { cart = r.data.cart; say(""); renderCart(); } else expire(r);
}

function expire(r) {
  if (r.status === 401) { user = null; cart = []; renderAuth(); say("로그인이 풀렸습니다. 다시 로그인하세요."); }
  else say(r.data.message);
}

async function order() {
  const r = await api("/api/order", "POST");
  if (r.ok) { cart = r.data.cart; say(r.data.message, true); } else expire(r);
  renderCart(); refresh();
}

async function authenticate(path) {
  const r = await api("/api/" + path, "POST", { username: $("u").value, password: $("p").value });
  if (!r.ok) { $("dmsg").textContent = r.data.message; return; }
  user = r.data.username; cart = r.data.cart; $("dlg").close(); $("p").value = ""; say(""); renderAuth();
}

$("authBtn").onclick = async () => {
  if (!user) { $("dmsg").textContent = ""; $("dlg").showModal(); return; }
  await api("/api/logout", "POST"); user = null; cart = []; renderAuth();
};
$("doLogin").onclick = () => authenticate("login");
$("doSignup").onclick = () => authenticate("signup");
$("doClose").onclick = () => $("dlg").close();

async function refresh() {
  const p = await api("/api/products"); if (p.ok) { products = p.data; renderProducts(); renderCart(); }
  const o = await api("/api/orders");
  if (o.ok && o.data.length) $("orders").innerHTML = o.data.map(x =>
    `<div class="line"><span>#${x.id} ${x.username}</span><span class="muted">${x.env} ${x.created_at}</span></div>`).join("");
}

(async () => {
  const me = await api("/api/me");
  if (me.ok) { user = me.data.username; cart = me.data.cart; }
  await refresh(); renderAuth();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
