{% extends "base.html" %}
{% block title %}로그인 · BEAVER Parfum{% endblock %}
{% block body %}
<div class="login panel">
<h1 style="margin-top:0;font-size:24px">로그인</h1>
<form method="post">
<label>아이디</label><input type="text" name="username" autofocus required>
<label>비밀번호</label><input type="password" name="password" required>
<button class="btn green full">로그인</button>
</form>
<p class="sub" style="margin:16px 0 0"><a href="{{ url_for('signup') }}">계정이 없나요? 회원가입</a></p>
</div>
{% endblock %}
