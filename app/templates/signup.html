{% extends "base.html" %}
{% block title %}Sign up · BEAVER Parfum{% endblock %}
{% block body %}
<div class="login panel">
<h1 style="margin-top:0;font-size:30px">Sign up</h1>
<form method="post">
<label>아이디</label><input type="text" name="username" autofocus required>
<label>비밀번호</label><input type="password" name="password" required>
<button class="btn green full">가입하기</button>
</form>
<p class="sub" style="margin:22px 0 10px">이미 계정이 있나요?</p>
<a class="btn line full" href="{{ url_for('login') }}">로그인</a>
</div>
{% endblock %}
