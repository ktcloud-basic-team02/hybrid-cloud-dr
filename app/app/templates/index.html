<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limited Shop</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Malgun Gothic", sans-serif; background: #f4f5f7; color: #222; }
    header { background: #1f2933; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    .badge { padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; }
    .badge.aws { background: #ff9900; color: #1f2933; }
    .badge.onprem { background: #3ea66b; color: #fff; }
    main { max-width: 720px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h2 { font-size: 15px; margin: 0 0 12px; color: #52606d; }
    .row { display: flex; gap: 8px; align-items: center; }
    input { flex: 1; padding: 8px 10px; border: 1px solid #cbd2d9; border-radius: 4px; font-size: 14px; }
    button { padding: 8px 16px; border: 0; border-radius: 4px; background: #2d6cdf; color: #fff; font-size: 14px; cursor: pointer; }
    button.sub { background: #e4e7eb; color: #323f4b; }
    .price { font-size: 22px; font-weight: 700; margin: 4px 0; }
    #msg { min-height: 20px; margin-top: 10px; font-size: 14px; color: #c0392b; }
    ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.8; }
    .muted { color: #7b8794; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Limited Shop</h1>
    <span class="badge {{ env }}">{{ env_name }}</span>
  </header>
  <main>
    <section class="card">
      <h2>로그인</h2>
      <div class="row">
        <input id="username" placeholder="이름">
        <button onclick="login()">로그인</button>
      </div>
      <div class="muted" id="who"></div>
    </section>

    <section class="card">
      <h2>이번 주 한정 판매</h2>
      <div id="pname">-</div>
      <div class="price">189,000원</div>
      <div class="muted">남은 수량 <b id="stock">-</b>개</div>
      <div class="row" style="margin-top:14px">
        <button class="sub" onclick="addCart()">장바구니 담기</button>
        <button onclick="order()">주문하기</button>
      </div>
      <div id="msg"></div>
    </section>

    <section class="card">
      <h2>장바구니</h2>
      <ul id="cart"><li class="muted">비어 있음</li></ul>
    </section>

    <section class="card">
      <h2>최근 주문</h2>
      <ul id="orders"><li class="muted">주문 내역이 없습니다</li></ul>
    </section>
  </main>

  <script>
    let user = "";
    const $ = id => document.getElementById(id);

    async function call(url, method, body) {
      const res = await fetch(url, {
        method: method || "GET",
        headers: {"Content-Type": "application/json"},
        body: body ? JSON.stringify(body) : undefined
      });
      return { ok: res.ok, data: await res.json() };
    }

    async function login() {
      const name = $("username").value.trim();
      const r = await call("/api/login", "POST", { username: name });
      $("msg").textContent = r.ok ? "" : r.data.message;
      if (r.ok) { user = name; $("who").textContent = name + " 님 로그인 중"; loadCart(); }
    }

    async function addCart() {
      const r = await call("/api/cart", "POST", { username: user });
      $("msg").textContent = r.ok ? "" : r.data.message;
      if (r.ok) renderCart(r.data.items);
    }

    async function loadCart() {
      const r = await call("/api/cart?username=" + encodeURIComponent(user));
      if (r.ok) renderCart(r.data.items);
    }

    function renderCart(items) {
      $("cart").innerHTML = items.length
        ? items.map(i => "<li>" + i + "</li>").join("")
        : '<li class="muted">비어 있음</li>';
    }

    async function order() {
      const r = await call("/api/order", "POST", { username: user });
      $("msg").textContent = r.data.message;
      if (r.ok) renderCart([]);
      refresh();
    }

    async function refresh() {
      const p = await call("/api/product");
      if (p.ok) { $("pname").textContent = p.data.name; $("stock").textContent = p.data.stock; }
      const o = await call("/api/orders");
      if (o.ok && o.data.length) {
        $("orders").innerHTML = o.data.map(x =>
          "<li>#" + x.id + " " + x.username + " (" + x.env + ", " + x.created_at + ")</li>").join("");
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
