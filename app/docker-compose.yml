services:
  db:
    image: mysql:8.0
    container_name: app-db-1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: project_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: app-app-1
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=project_db
      - DB_PORT=3306
      - SERVER_ENV=onprem
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
