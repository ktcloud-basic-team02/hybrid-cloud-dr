services:
  app:
    build: .
    ports: ["5000:5000"]
    environment:
      - APP_ENV=onprem
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpass
      - DB_NAME=beaver_db
      - INIT_DB=1
    depends_on: [db]
  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=beaver_db
    ports: ["3306:3306"]
